name: Test actual backup alert sender
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Send explicit test through the production alert function
        run: |
          python3 - <<'PY'
          import os
          from run_backup import alert
          result = alert(os.environ, 'GOSTEO: проверка исправленного отправщика уведомлений. Это тест, не сообщение об ошибке резервного копирования.')
          raise SystemExit(0 if result == {'configured': 2, 'failed': 0} else 1)
          PY
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BACKUP_ALERT_FROM: ${{ secrets.BACKUP_ALERT_FROM }}
          BACKUP_ALERT_EMAIL: ${{ secrets.BACKUP_ALERT_EMAIL }}
